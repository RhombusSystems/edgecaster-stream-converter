# MediaMTX configuration for EdgeCaster
# Documentation: https://github.com/bluenviron/mediamtx

###############################################
# General settings

logLevel: info
logDestinations: [stdout]

###############################################
# Control API (localhost only -> no auth required)
# Used by EdgeCaster for per-path liveness/throughput metrics.

api: yes
apiAddress: 127.0.0.1:9997

###############################################
# Timeouts (low-latency + fast recovery)
# readTimeout drops a stalled publisher (FFmpeg) quickly so recovery can fire.

readTimeout: 5s
writeTimeout: 10s
# writeQueueSize: default (512). A larger queue does NOT lower latency; it only
# buffers more before dropping a slow reader. Each reader has its own queue, so
# a slow consumer cannot add latency to the publisher or to other readers.

###############################################
# RTSP server

rtsp: yes
rtspAddress: :8554
# NOTE: MediaMTX renamed this key to "rtspTransports" in v1.11+. On the shipped
# v1.9.3 the key is "protocols". Update if the bundled binary is upgraded.
protocols: [tcp, udp]

# Allow publishing from localhost (FFmpeg)
# Allow reading from any source (VMS/NVR clients)
###############################################
# RTMP server (disabled for EdgeCaster)

rtmp: no

###############################################
# HLS server (disabled for EdgeCaster)

hls: no

###############################################
# WebRTC server (disabled for EdgeCaster)

webrtc: no

###############################################
# SRT server (disabled for EdgeCaster)

srt: no

###############################################
# Path defaults
# Note: RTSP authentication is not configured in v1.
# To add authentication later, configure publishUser/publishPass
# and readUser/readPass per path or globally.

pathDefaults:
  # Allow any source to publish
  source: publisher

  # Record settings (disabled)
  record: no

# Dynamic paths: any path name FFmpeg publishes to will be auto-created
paths:
  all_others:
