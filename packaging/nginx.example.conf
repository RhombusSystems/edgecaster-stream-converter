# Nginx reverse proxy configuration for EdgeCaster
# Install: sudo cp nginx.example.conf /etc/nginx/sites-available/edgecaster
#          sudo ln -sf /etc/nginx/sites-available/edgecaster /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name edgecaster.local _;

    # Frontend static files
    root /opt/edgecaster/frontend/dist;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
